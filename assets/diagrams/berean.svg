<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#a3e635" stop-opacity="0.10"/><stop offset="0.6" stop-color="#a3e635" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">The Berean Test</text><text x="56" y="98" font-size="21" fill="#aab8df">“They examined the Scriptures daily to see if these things were so.”</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><rect x="56" y="150" width="1488" height="90" rx="16" fill="rgba(163,230,53,0.08)" stroke="#a3e635" stroke-width="2.4" opacity="1"/><text x="800" y="186" font-size="19" fill="#eef3ff" font-weight="400" text-anchor="middle" style="">“…they received the message with great eagerness and examined the Scriptures every day</text><text x="800" y="214" font-size="19" fill="#eef3ff" font-weight="400" text-anchor="middle" style="">to see if what Paul said was true.”   — Acts 17:11 (BSB)</text><text x="56" y="290" font-size="22" fill="#a3e635" font-weight="800" text-anchor="start" style="">Five habits · thirty seconds · catches most of what goes wrong</text><rect x="56.0" y="320" width="272" height="230" rx="16" fill="#111733" stroke="#a3e635" stroke-width="2.4" opacity="1"/><rect x="56.0" y="320" width="6" height="230" rx="3" fill="#a3e635"/><text x="74.0" y="355" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">1 · Ask for sources</text><text x="74.0" y="382.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">“Where does it say that?</text><text x="74.0" y="402.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Show me.” No source, treat</text><text x="74.0" y="423.42" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">it as a guess.</text><rect x="360.0" y="320" width="272" height="230" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.4" opacity="1"/><rect x="360.0" y="320" width="6" height="230" rx="3" fill="#34d399"/><text x="378.0" y="355" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">2 · Check one</text><text x="378.0" y="382.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Open one cited verse, page,</text><text x="378.0" y="402.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">or link yourself. One check</text><text x="378.0" y="423.42" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">catches most errors.</text><rect x="664.0" y="320" width="272" height="230" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="664.0" y="320" width="6" height="230" rx="3" fill="#5eead4"/><text x="682.0" y="355" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">3 · Ask the other side</text><text x="682.0" y="382.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">“Argue against what you</text><text x="682.0" y="402.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">just told me.” You will</text><text x="682.0" y="423.42" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">learn which answer was</text><text x="682.0" y="443.88" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">stronger.</text><rect x="968.0" y="320" width="272" height="230" rx="16" fill="#111733" stroke="#fbbf24" stroke-width="2.4" opacity="1"/><rect x="968.0" y="320" width="6" height="230" rx="3" fill="#fbbf24"/><text x="986.0" y="355" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">4 · Notice the confidence</text><text x="986.0" y="382.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">A sure tone is not</text><text x="986.0" y="402.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">evidence. It sounds exactly</text><text x="986.0" y="423.42" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">the same when it is wrong.</text><rect x="1272.0" y="320" width="272" height="230" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="1272.0" y="320" width="6" height="230" rx="3" fill="#c4b5fd"/><text x="1290.0" y="355" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">5 · Keep your judgment</text><text x="1290.0" y="382.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">The AI arranges; you</text><text x="1290.0" y="402.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">decide. That is your job,</text><text x="1290.0" y="423.42" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">not a limitation.</text><line x1="334.0" y1="435.0" x2="343.0" y2="435.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="354.0,435.0 344.0,439.5 344.0,430.5" fill="#aab8df" opacity="1.0"/><line x1="638.0" y1="435.0" x2="647.0" y2="435.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="658.0,435.0 648.0,439.5 648.0,430.5" fill="#aab8df" opacity="1.0"/><line x1="942.0" y1="435.0" x2="951.0" y2="435.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="962.0,435.0 952.0,439.5 952.0,430.5" fill="#aab8df" opacity="1.0"/><line x1="1246.0" y1="435.0" x2="1255.0" y2="435.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="1266.0,435.0 1256.0,439.5 1256.0,430.5" fill="#aab8df" opacity="1.0"/><rect x="56" y="600" width="1488" height="200" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.4" opacity="1"/><text x="76" y="636" font-size="20" fill="#34d399" font-weight="800" text-anchor="start" style="">Try it on a chatbot right now</text><text x="76" y="674" font-size="17" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Ask:  “When was the Westminster Confession written, and who wrote it?”  →  then:  “Give me your sources.”</text><text x="76" y="706" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Open one. If the date is 1646–47 and the body is the Westminster Assembly, fine. If it names a single author, you just caught a confident mistake.</text><text x="76" y="738" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Then:  “What in your last answer are you least sure about?”  It will tell you. That question alone is worth the morning.</text><text x="76" y="776" font-size="15" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Bible Companion does steps 1 and 2 for you on every answer. Steps 3 to 5 are still yours.</text><text x="56" y="846" font-size="22" fill="#38bdf8" font-weight="800" text-anchor="start" style="">When to lean in, when to verify</text><defs><linearGradient id="bdial" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs><rect x="56" y="870" width="1488" height="64" rx="32" fill="url(#bdial)" stroke="none" stroke-width="0" opacity="0.85"/><text x="104" y="910" font-size="19" fill="#06301f" font-weight="800" text-anchor="start" style="">LEAN IN</text><text x="280" y="910" font-size="16" fill="#0b2a12" font-weight="400" text-anchor="start" style="">drafts · summaries · brainstorming · a first outline</text><text x="980" y="910" font-size="19" fill="#3a1010" font-weight="800" text-anchor="start" style="">VERIFY</text><text x="1100" y="910" font-size="16" fill="#3a1010" font-weight="400" text-anchor="start" style="">dates · citations · medical · legal · money</text><text x="56" y="986" font-size="18" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">If the Bereans checked an apostle, you can check a chatbot.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>