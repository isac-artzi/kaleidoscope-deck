<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#5eead4" stop-opacity="0.10"/><stop offset="0.6" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">What Is a Language Model?</text><text x="56" y="98" font-size="21" fill="#aab8df">A system that learns the patterns of language by predicting the next piece of text.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><text x="56" y="165" font-size="22" fill="#5eead4" font-weight="800" text-anchor="start" style="">1 · How it&#x27;s built  —  TRAINING</text><rect x="56.0" y="196" width="256" height="150" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="56.0" y="196" width="6" height="150" rx="3" fill="#5eead4"/><text x="74.0" y="232" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Huge text corpus</text><text x="74.0" y="260.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Books, websites, code,</text><text x="74.0" y="282.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Wikipedia — trillions of</text><text x="74.0" y="304.06" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">words</text><rect x="364.0" y="196" width="256" height="150" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="364.0" y="196" width="6" height="150" rx="3" fill="#5eead4"/><text x="382.0" y="232" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Break into tokens</text><text x="382.0" y="260.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Text is split into</text><text x="382.0" y="282.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">tokens (word-pieces the</text><text x="382.0" y="304.06" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">model reads)</text><rect x="672.0" y="196" width="256" height="150" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="672.0" y="196" width="6" height="150" rx="3" fill="#5eead4"/><text x="690.0" y="232" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Guess the next token</text><text x="690.0" y="260.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">The neural network</text><text x="690.0" y="282.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">predicts what comes next</text><rect x="980.0" y="196" width="256" height="150" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="980.0" y="196" width="6" height="150" rx="3" fill="#5eead4"/><text x="998.0" y="232" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Adjust the weights</text><text x="998.0" y="260.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Compare to the real</text><text x="998.0" y="282.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">text; nudge billions of</text><text x="998.0" y="304.06" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">numbers</text><rect x="1288.0" y="196" width="256" height="150" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="1288.0" y="196" width="6" height="150" rx="3" fill="#5eead4"/><text x="1306.0" y="232" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Repeat — a lot</text><text x="1306.0" y="260.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Trillions of times, on</text><text x="1306.0" y="282.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">warehouses of GPUs</text><line x1="320.0" y1="271.0" x2="345.0" y2="271.0" stroke="#5eead4" stroke-width="2.6" opacity="1.0"/><polygon points="356.0,271.0 346.0,275.5 346.0,266.5" fill="#5eead4" opacity="1.0"/><line x1="628.0" y1="271.0" x2="653.0" y2="271.0" stroke="#5eead4" stroke-width="2.6" opacity="1.0"/><polygon points="664.0,271.0 654.0,275.5 654.0,266.5" fill="#5eead4" opacity="1.0"/><line x1="936.0" y1="271.0" x2="961.0" y2="271.0" stroke="#5eead4" stroke-width="2.6" opacity="1.0"/><polygon points="972.0,271.0 962.0,275.5 962.0,266.5" fill="#5eead4" opacity="1.0"/><line x1="1244.0" y1="271.0" x2="1269.0" y2="271.0" stroke="#5eead4" stroke-width="2.6" opacity="1.0"/><polygon points="1280.0,271.0 1270.0,275.5 1270.0,266.5" fill="#5eead4" opacity="1.0"/><text x="56" y="430" font-size="22" fill="#38bdf8" font-weight="800" text-anchor="start" style="">2 · What it becomes</text><rect x="56" y="452" width="1488" height="99.44" rx="16" fill="#111733" stroke="#38bdf8" stroke-width="2.4" opacity="1"/><rect x="56" y="452" width="6" height="99.44" rx="3" fill="#38bdf8"/><text x="74" y="491" font-size="23" fill="#eef3ff" font-weight="700" text-anchor="start" style="">A trained model = billions of weights (numbers) that encode the patterns of language</text><text x="74" y="520.0" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">No facts are stored as a list — the patterns of grammar, knowledge, style and reasoning are baked into the weights.</text><rect x="60" y="560" width="95" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#38bdf8" stroke-width="2" opacity="1"/><text x="107.5" y="584.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">grammar</text><rect x="167" y="560" width="220" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#38bdf8" stroke-width="2" opacity="1"/><text x="277.0" y="584.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">facts &amp; associations</text><rect x="399" y="560" width="162" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#38bdf8" stroke-width="2" opacity="1"/><text x="480.0" y="584.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">writing styles</text><rect x="573" y="560" width="200" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#38bdf8" stroke-width="2" opacity="1"/><text x="673.0" y="584.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">reasoning patterns</text><rect x="785" y="560" width="66" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#38bdf8" stroke-width="2" opacity="1"/><text x="818.0" y="584.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">code</text><rect x="863" y="560" width="162" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#38bdf8" stroke-width="2" opacity="1"/><text x="944.0" y="584.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">many languages</text><text x="56" y="660" font-size="22" fill="#818cf8" font-weight="800" text-anchor="start" style="">3 · How you use it  —  INFERENCE</text><rect x="56.0" y="692" width="224" height="150" rx="16" fill="#111733" stroke="#818cf8" stroke-width="2.4" opacity="1"/><rect x="56.0" y="692" width="6" height="150" rx="3" fill="#818cf8"/><text x="74.0" y="727" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Your prompt</text><text x="74.0" y="755.0" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">A question or</text><text x="74.0" y="776.12" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">instruction</text><rect x="324.0" y="692" width="224" height="150" rx="16" fill="#111733" stroke="#818cf8" stroke-width="2.4" opacity="1"/><rect x="324.0" y="692" width="6" height="150" rx="3" fill="#818cf8"/><text x="342.0" y="727" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Predict, token by token</text><text x="342.0" y="755.0" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Each token chosen</text><text x="342.0" y="776.12" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">from probabilities</text><rect x="592.0" y="692" width="224" height="150" rx="16" fill="#111733" stroke="#818cf8" stroke-width="2.4" opacity="1"/><rect x="592.0" y="692" width="6" height="150" rx="3" fill="#818cf8"/><text x="610.0" y="727" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Answer streams out</text><text x="610.0" y="755.0" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Words appear as</text><text x="610.0" y="776.12" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">they&#x27;re produced</text><line x1="286.0" y1="767.0" x2="307.0" y2="767.0" stroke="#818cf8" stroke-width="2.6" opacity="1.0"/><polygon points="318.0,767.0 308.0,771.5 308.0,762.5" fill="#818cf8" opacity="1.0"/><line x1="554.0" y1="767.0" x2="575.0" y2="767.0" stroke="#818cf8" stroke-width="2.6" opacity="1.0"/><polygon points="586.0,767.0 576.0,771.5 576.0,762.5" fill="#818cf8" opacity="1.0"/><text x="860" y="660" font-size="22" fill="#fbbf24" font-weight="800" text-anchor="start" style="">The model zoo  —  who makes them</text><rect x="860" y="692" width="684" height="250" rx="16" fill="#111733" stroke="#fbbf24" stroke-width="2.4" opacity="1"/><rect x="884" y="716" width="98" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="933.0" y="740" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Claude</text><text x="933.0" y="760" font-size="13" fill="#aab8df" font-weight="400" text-anchor="middle" style="">Anthropic</text><rect x="1052" y="716" width="74" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="1089.0" y="740" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">GPT</text><text x="1089.0" y="760" font-size="13" fill="#aab8df" font-weight="400" text-anchor="middle" style="">OpenAI</text><rect x="1220" y="716" width="92" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="1266.0" y="740" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Gemini</text><text x="1266.0" y="760" font-size="13" fill="#aab8df" font-weight="400" text-anchor="middle" style="">Google</text><rect x="1388" y="716" width="82" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="1429.0" y="740" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Llama</text><text x="1429.0" y="760" font-size="13" fill="#aab8df" font-weight="400" text-anchor="middle" style="">Meta</text><rect x="884" y="812" width="71" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="919.5" y="836" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Grok</text><text x="919.5" y="856" font-size="13" fill="#aab8df" font-weight="400" text-anchor="middle" style="">xAI</text><rect x="1052" y="812" width="82" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="1093.0" y="836" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Qwen</text><text x="1093.0" y="856" font-size="13" fill="#aab8df" font-weight="400" text-anchor="middle" style="">Alibaba</text><rect x="1220" y="812" width="114" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="1277.0" y="836" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">DeepSeek</text><text x="1277.0" y="856" font-size="13" fill="#aab8df" font-weight="400" text-anchor="middle" style="">China</text><rect x="1388" y="812" width="103" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="1439.5" y="836" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Mistral</text><text x="1439.5" y="856" font-size="13" fill="#aab8df" font-weight="400" text-anchor="middle" style="">France</text><text x="884" y="916" font-size="15" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Cloud giants and small local models share the same core idea.</text><text x="56" y="986" font-size="17" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Key idea: a language model predicts plausible text — it does NOT look words up in a database. That is its power and its risk.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>