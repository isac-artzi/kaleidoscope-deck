<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.10"/><stop offset="0.6" stop-color="#38bdf8" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">AI as Co-Architect: Building Software Together</text><text x="56" y="98" font-size="21" fill="#aab8df">Not autocomplete — a partner across the whole lifecycle, from idea to deployed product.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><text x="56" y="165" font-size="22" fill="#38bdf8" font-weight="800" text-anchor="start" style="">The build loop — you steer, AI does the heavy lifting</text><rect x="56.0" y="210" width="330" height="150" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.6" opacity="1"/><rect x="56.0" y="210" width="6" height="150" rx="3" fill="#5eead4"/><text x="76.0" y="246" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">1  Discuss &amp; ideate</text><text x="76.0" y="274" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Talk through the problem</text><rect x="76.0" y="322" width="220" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#5eead4" stroke-width="1.5"/><text x="88.0" y="340" font-size="14" fill="#5eead4" font-weight="700" text-anchor="start" style="">Claude Desktop</text><rect x="442.0" y="210" width="330" height="150" rx="16" fill="#111733" stroke="#38bdf8" stroke-width="2.6" opacity="1"/><rect x="442.0" y="210" width="6" height="150" rx="3" fill="#38bdf8"/><text x="462.0" y="246" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">2  Write the PRD</text><text x="462.0" y="274" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Turn ideas into a clear spec</text><rect x="462.0" y="322" width="220" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#38bdf8" stroke-width="1.5"/><text x="474.0" y="340" font-size="14" fill="#38bdf8" font-weight="700" text-anchor="start" style="">Claude Desktop</text><rect x="828.0" y="210" width="330" height="150" rx="16" fill="#111733" stroke="#818cf8" stroke-width="2.6" opacity="1"/><rect x="828.0" y="210" width="6" height="150" rx="3" fill="#818cf8"/><text x="848.0" y="246" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">3  Design architecture</text><text x="848.0" y="274" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Components, data, trade-offs</text><rect x="848.0" y="322" width="262" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#818cf8" stroke-width="1.5"/><text x="860.0" y="340" font-size="14" fill="#818cf8" font-weight="700" text-anchor="start" style="">Claude + diagrams</text><rect x="1214.0" y="210" width="330" height="150" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.6" opacity="1"/><rect x="1214.0" y="210" width="6" height="150" rx="3" fill="#c4b5fd"/><text x="1234.0" y="246" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">4  Build</text><text x="1234.0" y="274" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Writes &amp; edits real code, runs</text><text x="1234.0" y="296" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">commands</text><rect x="1234.0" y="322" width="178" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#c4b5fd" stroke-width="1.5"/><text x="1246.0" y="340" font-size="14" fill="#c4b5fd" font-weight="700" text-anchor="start" style="">Claude Code</text><rect x="1214.0" y="470" width="330" height="150" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.6" opacity="1"/><rect x="1214.0" y="470" width="6" height="150" rx="3" fill="#34d399"/><text x="1234.0" y="506" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">5  Test</text><text x="1234.0" y="534" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Generates tests, finds &amp; fixes</text><text x="1234.0" y="556" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">bugs</text><rect x="1234.0" y="582" width="178" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#34d399" stroke-width="1.5"/><text x="1246.0" y="600" font-size="14" fill="#34d399" font-weight="700" text-anchor="start" style="">Claude Code</text><rect x="635.0" y="470" width="330" height="150" rx="16" fill="#111733" stroke="#a3e635" stroke-width="2.6" opacity="1"/><rect x="635.0" y="470" width="6" height="150" rx="3" fill="#a3e635"/><text x="655.0" y="506" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">6  Deploy</text><text x="655.0" y="534" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">CI/CD, configs, release notes</text><rect x="655.0" y="582" width="290" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#a3e635" stroke-width="1.5"/><text x="667.0" y="600" font-size="14" fill="#a3e635" font-weight="700" text-anchor="start" style="">Claude Code + GitHub</text><rect x="56.0" y="470" width="330" height="150" rx="16" fill="#111733" stroke="#fbbf24" stroke-width="2.6" opacity="1"/><rect x="56.0" y="470" width="6" height="150" rx="3" fill="#fbbf24"/><text x="76.0" y="506" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">7  Observe &amp; iterate</text><text x="76.0" y="534" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Watch real use, feed it back</text><rect x="76.0" y="582" width="164" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#fbbf24" stroke-width="1.5"/><text x="88.0" y="600" font-size="14" fill="#fbbf24" font-weight="700" text-anchor="start" style="">API + logs</text><line x1="392.0" y1="285.0" x2="425.0" y2="285.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="436.0,285.0 426.0,289.5 426.0,280.5" fill="#aab8df" opacity="1.0"/><line x1="778.0" y1="285.0" x2="811.0" y2="285.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="822.0,285.0 812.0,289.5 812.0,280.5" fill="#aab8df" opacity="1.0"/><line x1="1164.0" y1="285.0" x2="1197.0" y2="285.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="1208.0,285.0 1198.0,289.5 1198.0,280.5" fill="#aab8df" opacity="1.0"/><line x1="1379.0" y1="366" x2="1379.0" y2="453.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="1379.0,464.0 1374.5,454.0 1383.5,454.0" fill="#aab8df" opacity="1.0"/><line x1="1208.0" y1="545.0" x2="982.0" y2="545.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="971.0,545.0 981.0,540.5 981.0,549.5" fill="#aab8df" opacity="1.0"/><line x1="629.0" y1="545.0" x2="403.0" y2="545.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="392.0,545.0 402.0,540.5 402.0,549.5" fill="#aab8df" opacity="1.0"/><line x1="221.0" y1="626" x2="221.0" y2="639.0" stroke="#fbbf24" stroke-width="2.6" opacity="1.0"/><polygon points="221.0,650.0 216.5,640.0 225.5,640.0" fill="#fbbf24" opacity="1.0"/><path d="M 221.0 650 L 38 650 L 38 184 L 221.0 184" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-dasharray="7 6"/><line x1="221.0" y1="184" x2="221.0" y2="193.0" stroke="#fbbf24" stroke-width="2.6" opacity="1.0"/><polygon points="221.0,204.0 216.5,194.0 225.5,194.0" fill="#fbbf24" opacity="1.0"/><text x="250" y="638" font-size="15" fill="#fbbf24" font-weight="400" text-anchor="start" style="font-style:italic;">iterate — the loop never really ends</text><rect x="444" y="366" width="712" height="98" rx="16" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="2.4" opacity="1"/><text x="800" y="396" font-size="20" fill="#eef3ff" font-weight="800" text-anchor="middle" style="">Human-in-the-loop</text><text x="800" y="424" font-size="16" fill="#38bdf8" font-weight="400" text-anchor="middle" style="">YOU set goals, approve, correct, decide.</text><text x="800" y="448" font-size="16" fill="#aab8df" font-weight="400" text-anchor="middle" style="">AI drafts, generates code, runs tests, proposes options.</text><text x="56" y="720" font-size="22" fill="#818cf8" font-weight="800" text-anchor="start" style="">The toolkit</text><rect x="56" y="744" width="170" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="141.0" y="768.6666666666666" font-size="17" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">Claude Desktop</text><rect x="240" y="744" width="140" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="310.0" y="768.6666666666666" font-size="17" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">Claude Code</text><rect x="394" y="744" width="160" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="474.0" y="768.6666666666666" font-size="17" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">Anthropic API</text><rect x="568" y="744" width="89" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="612.5" y="768.6666666666666" font-size="17" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">GitHub</text><rect x="671" y="744" width="109" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="725.5" y="768.6666666666666" font-size="17" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">Your IDE</text><rect x="794" y="744" width="109" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="848.5" y="768.6666666666666" font-size="17" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">Terminal</text><rect x="56" y="824" width="1488" height="150" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.4" opacity="1"/><text x="76" y="856" font-size="20" fill="#34d399" font-weight="800" text-anchor="start" style="">A concrete pass:  “Build me a tool that flags expiring contracts.”</text><text x="76" y="892" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">1) Discuss scope  →  2) Claude writes a 1-page PRD  →  3) proposes a simple architecture  →  4) Claude Code builds it,</text><text x="76" y="920" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">    reading your files and running the app  →  5) writes tests, fixes the failures  →  6) helps deploy  →  7) you try it and ask for changes.</text><text x="76" y="952" font-size="16" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Every step is a conversation. You review and approve as you go.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>