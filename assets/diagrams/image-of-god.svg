<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.10"/><stop offset="0.6" stop-color="#fbbf24" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">Made in the Image of God</text><text x="56" y="98" font-size="21" fill="#aab8df">What AI is, and what it is not.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><rect x="56" y="160" width="728" height="60" rx="14" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="2.4" opacity="1"/><text x="420.0" y="199" font-size="24" fill="#fbbf24" font-weight="800" text-anchor="middle" style="">Made in the image of God</text><rect x="816" y="160" width="728" height="60" rx="14" fill="rgba(129,140,248,0.10)" stroke="#818cf8" stroke-width="2.4" opacity="1"/><text x="1180.0" y="199" font-size="24" fill="#818cf8" font-weight="800" text-anchor="middle" style="">Made by people, from human words</text><rect x="56" y="246" width="728" height="78" rx="14" fill="#111733" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="80" y="280.0" font-size="19" fill="#eef3ff" font-weight="400" text-anchor="start" style="">A body, a history, a death</text><rect x="816" y="246" width="728" height="78" rx="14" fill="#111733" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="840" y="280.0" font-size="19" fill="#aab8df" font-weight="400" text-anchor="start" style="">No body. No yesterday unless we hand it one.</text><rect x="56" y="336" width="728" height="78" rx="14" fill="#111733" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="80" y="370.0" font-size="19" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Knows things because it lived them</text><rect x="816" y="336" width="728" height="78" rx="14" fill="#111733" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="840" y="370.0" font-size="19" fill="#aab8df" font-weight="400" text-anchor="start" style="">Knows how we talk about things. A map, not the territory.</text><rect x="56" y="426" width="728" height="78" rx="14" fill="#111733" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="80" y="460.0" font-size="19" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Has a stake: can be wronged, can repent</text><rect x="816" y="426" width="728" height="78" rx="14" fill="#111733" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="840" y="460.0" font-size="19" fill="#aab8df" font-weight="400" text-anchor="start" style="">Has no stake. Cannot be harmed by being wrong.</text><rect x="56" y="516" width="728" height="78" rx="14" fill="#111733" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="80" y="550.0" font-size="19" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Has a calling: to glorify God and enjoy him forever</text><rect x="816" y="516" width="728" height="78" rx="14" fill="#111733" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="840" y="550.0" font-size="19" fill="#aab8df" font-weight="400" text-anchor="start" style="">Has a task: to produce the next plausible word.</text><rect x="56" y="606" width="728" height="78" rx="14" fill="#111733" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="80" y="640.0" font-size="19" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Can love, and be loved</text><rect x="816" y="606" width="728" height="78" rx="14" fill="#111733" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="840" y="640.0" font-size="19" fill="#aab8df" font-weight="400" text-anchor="start" style="">Can be agreeable. Always. That is not the same thing.</text><rect x="56" y="696" width="728" height="78" rx="14" fill="#111733" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="80" y="730.0" font-size="19" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Accountable</text><rect x="816" y="696" width="728" height="78" rx="14" fill="#111733" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="840" y="730.0" font-size="19" fill="#aab8df" font-weight="400" text-anchor="start" style="">A tool. The accountability stays with the hands that use it.</text><rect x="56" y="800" width="728" height="122" rx="14" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6" opacity="1" stroke-dasharray="6 6"/><text x="80" y="830.0" font-size="15.5" fill="#eef3ff" font-weight="400" text-anchor="start" style="">“So God created man in His own image; in the image of God He created him; male and</text><text x="80" y="852.94" font-size="15.5" fill="#eef3ff" font-weight="400" text-anchor="start" style="">female He created them.” — Genesis 1:27 (BSB)</text><text x="80" y="875.88" font-size="15.5" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Q. What is the chief end of man? A. To glorify God, and to enjoy him forever. —</text><text x="80" y="898.8199999999999" font-size="15.5" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Westminster Shorter Catechism, Q1</text><rect x="816" y="800" width="728" height="122" rx="14" fill="rgba(129,140,248,0.06)" stroke="#818cf8" stroke-width="1.6" opacity="1" stroke-dasharray="6 6"/><text x="840" y="830.0" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">“All truth is from God; and consequently, if wicked men have said anything that is</text><text x="840" y="852.94" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">true and just, we ought not to reject it.” — Calvin, on Titus 1:12</text><text x="840" y="875.88" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Use the tool with gratitude and without reverence.</text><text x="56" y="986" font-size="18" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">It changes the work. It does not change who the work is for.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>