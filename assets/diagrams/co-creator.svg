<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1080" fill="#0a0e1c"/><rect width="1600" height="1080" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#5eead4" stop-opacity="0.10"/><stop offset="0.6" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">AI in Your Week: One Habit, Every Task</text><text x="56" y="98" font-size="21" fill="#aab8df">Discuss → Plan → Make → Check → Refine. The same loop for a study guide, a potluck, a brochure, or a letter.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><circle cx="800" cy="560" r="164" fill="rgba(94,234,212,0.05)" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 7"/><line x1="820.5428207519753" y1="454.9252329215011" x2="885.5" y2="502.1" stroke="#5eead4" stroke-width="2.4" opacity="1.0"/><polygon points="893.6,508.0 883.8,505.9 888.6,499.3" fill="#5eead4" opacity="1.0"/><line x1="906.2801226529606" y1="547.0674948320041" x2="881.5" y2="623.4" stroke="#5eead4" stroke-width="2.4" opacity="1.0"/><polygon points="878.4,632.9 877.3,623.0 885.1,625.5" fill="#5eead4" opacity="1.0"/><line x1="845.1419073760619" y1="657.0820393249937" x2="764.9" y2="657.1" stroke="#5eead4" stroke-width="2.4" opacity="1.0"/><polygon points="754.9,657.1 764.0,653.0 764.0,661.2" fill="#5eead4" opacity="1.0"/><line x1="721.6191104224454" y1="632.9325051679959" x2="696.8" y2="556.6" stroke="#5eead4" stroke-width="2.4" opacity="1.0"/><polygon points="693.7,547.1 700.4,554.5 692.7,557.0" fill="#5eead4" opacity="1.0"/><line x1="706.4160387965569" y1="507.99272775350516" x2="771.4" y2="460.8" stroke="#5eead4" stroke-width="2.4" opacity="1.0"/><polygon points="779.5,454.9 774.5,463.6 769.7,457.0" fill="#5eead4" opacity="1.0"/><circle cx="800" cy="440" r="40" fill="#111733" stroke="#5eead4" stroke-width="2.4"/><text x="800.0" y="445.0" font-size="16" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Discuss</text><circle cx="914" cy="523" r="40" fill="#111733" stroke="#5eead4" stroke-width="2.4"/><text x="914.1267819554184" y="527.9179606750063" font-size="16" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Plan</text><circle cx="871" cy="657" r="40" fill="#111733" stroke="#5eead4" stroke-width="2.4"/><text x="870.5342302750968" y="662.0820393249937" font-size="16" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Make</text><circle cx="729" cy="657" r="40" fill="#111733" stroke="#5eead4" stroke-width="2.4"/><text x="729.4657697249032" y="662.0820393249937" font-size="16" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Check</text><circle cx="686" cy="523" r="40" fill="#111733" stroke="#5eead4" stroke-width="2.4"/><text x="685.8732180445816" y="527.9179606750063" font-size="16" fill="#eef3ff" font-weight="700" text-anchor="middle" style="">Refine</text><text x="800" y="556" font-size="20" fill="#5eead4" font-weight="800" text-anchor="middle" style="">ONE</text><text x="800" y="580" font-size="20" fill="#5eead4" font-weight="800" text-anchor="middle" style="">METHOD</text><text x="56" y="165" font-size="22" fill="#5eead4" font-weight="800" text-anchor="start" style="">Same pattern, every field — AI as co-creator</text><rect x="56" y="205" width="330" height="116" rx="16" fill="#111733" stroke="#38bdf8" stroke-width="2.4" opacity="1"/><rect x="56" y="205" width="6" height="116" rx="3" fill="#38bdf8"/><text x="74" y="240" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">💻 Software</text><text x="74" y="267.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">idea → PRD → code → test → ship</text><line x1="392" y1="263.0" x2="626.3" y2="553.0" stroke="#7486b3" stroke-width="1.8" opacity="1.0" stroke-dasharray="4 5"/><polygon points="632.0,560.0 624.0,555.9 629.7,551.3" fill="#7486b3" opacity="1.0"/><rect x="56" y="345" width="330" height="116" rx="16" fill="#111733" stroke="#818cf8" stroke-width="2.4" opacity="1"/><rect x="56" y="345" width="6" height="116" rx="3" fill="#818cf8"/><text x="74" y="380" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🏛️ Architecture</text><text x="74" y="407.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">brief → floor plan → 3D model →</text><text x="74" y="427.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">review → permit</text><line x1="392" y1="403.0" x2="624.5" y2="555.1" stroke="#7486b3" stroke-width="1.8" opacity="1.0" stroke-dasharray="4 5"/><polygon points="632.0,560.0 623.1,558.6 627.1,552.4" fill="#7486b3" opacity="1.0"/><rect x="56" y="485" width="330" height="116" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.4" opacity="1"/><rect x="56" y="485" width="6" height="116" rx="3" fill="#34d399"/><text x="74" y="520" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">⚕️ Medicine</text><text x="74" y="547.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">symptoms → differential → care</text><text x="74" y="567.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">plan → monitor → adjust</text><line x1="392" y1="543.0" x2="623.0" y2="559.4" stroke="#7486b3" stroke-width="1.8" opacity="1.0" stroke-dasharray="4 5"/><polygon points="632.0,560.0 623.5,563.1 624.1,555.8" fill="#7486b3" opacity="1.0"/><rect x="56" y="625" width="330" height="116" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="56" y="625" width="6" height="116" rx="3" fill="#c4b5fd"/><text x="74" y="660" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">⚖️ Law</text><text x="74" y="687.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">facts → research → draft →</text><text x="74" y="707.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">red-line → finalize</text><line x1="392" y1="683.0" x2="624.0" y2="564.1" stroke="#7486b3" stroke-width="1.8" opacity="1.0" stroke-dasharray="4 5"/><polygon points="632.0,560.0 626.4,567.0 623.0,560.5" fill="#7486b3" opacity="1.0"/><rect x="1214" y="205" width="330" height="116" rx="16" fill="#111733" stroke="#fb923c" stroke-width="2.4" opacity="1"/><rect x="1214" y="205" width="6" height="116" rx="3" fill="#fb923c"/><text x="1232" y="240" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">📣 Marketing</text><text x="1232" y="267.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">goal → strategy → content → A/B</text><text x="1232" y="287.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">test → optimize</text><line x1="1208" y1="263.0" x2="973.7" y2="553.0" stroke="#7486b3" stroke-width="1.8" opacity="1.0" stroke-dasharray="4 5"/><polygon points="968.0,560.0 970.3,551.3 976.0,555.9" fill="#7486b3" opacity="1.0"/><rect x="1214" y="345" width="330" height="116" rx="16" fill="#111733" stroke="#a3e635" stroke-width="2.4" opacity="1"/><rect x="1214" y="345" width="6" height="116" rx="3" fill="#a3e635"/><text x="1232" y="380" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🔬 Science</text><text x="1232" y="407.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">question → hypothesis → design →</text><text x="1232" y="427.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">analyze → publish</text><line x1="1208" y1="403.0" x2="975.5" y2="555.1" stroke="#7486b3" stroke-width="1.8" opacity="1.0" stroke-dasharray="4 5"/><polygon points="968.0,560.0 972.9,552.4 976.9,558.6" fill="#7486b3" opacity="1.0"/><rect x="1214" y="485" width="330" height="116" rx="16" fill="#111733" stroke="#fb7185" stroke-width="2.4" opacity="1"/><rect x="1214" y="485" width="6" height="116" rx="3" fill="#fb7185"/><text x="1232" y="520" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🎬 Film &amp; Music</text><text x="1232" y="547.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">concept → script/score → produce →</text><text x="1232" y="567.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">screen → re-cut</text><line x1="1208" y1="543.0" x2="977.0" y2="559.4" stroke="#7486b3" stroke-width="1.8" opacity="1.0" stroke-dasharray="4 5"/><polygon points="968.0,560.0 975.9,555.8 976.5,563.1" fill="#7486b3" opacity="1.0"/><rect x="1214" y="625" width="330" height="116" rx="16" fill="#111733" stroke="#fbbf24" stroke-width="2.4" opacity="1"/><rect x="1214" y="625" width="6" height="116" rx="3" fill="#fbbf24"/><text x="1232" y="660" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🗓️ Life &amp; Events</text><text x="1232" y="687.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">constraints → plan → book →</text><text x="1232" y="707.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">dry-run → adjust</text><line x1="1208" y1="683.0" x2="976.0" y2="564.1" stroke="#7486b3" stroke-width="1.8" opacity="1.0" stroke-dasharray="4 5"/><polygon points="968.0,560.0 977.0,560.5 973.6,567.0" fill="#7486b3" opacity="1.0"/><rect x="56" y="770" width="1488" height="130" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><text x="800" y="808" font-size="21" fill="#5eead4" font-weight="800" text-anchor="middle" style="">The point</text><text x="800" y="844" font-size="19" fill="#eef3ff" font-weight="400" text-anchor="middle" style="">It is the SAME loop everywhere — only the vocabulary and the artifacts change.</text><text x="800" y="876" font-size="17" fill="#aab8df" font-weight="400" text-anchor="middle" style="">Learn the habit once (discuss → plan → make → check → refine) and you can apply AI to almost anything you do. The check step is the Berean step.</text><text x="56" y="1004" font-size="17" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">AI is a co-designer, co-planner, co-architect — a thinking partner that drafts, critiques and iterates with you.</text><text x="56" y="1054" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1054" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>