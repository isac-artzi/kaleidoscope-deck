<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#818cf8" stop-opacity="0.10"/><stop offset="0.6" stop-color="#818cf8" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">Inside a Neural Network: the Transformer</text><text x="56" y="98" font-size="21" fill="#aab8df">The architecture behind every modern language model — turn words into numbers, weigh context, predict.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><text x="56" y="165" font-size="22" fill="#5eead4" font-weight="800" text-anchor="start" style="">Step 1 · Turn words into numbers</text><rect x="56" y="196" width="360" height="95.78" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="56" y="196" width="6" height="95.78" rx="3" fill="#5eead4"/><text x="74" y="232" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Words</text><text x="74" y="260.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">“The cat sat on the mat”</text><rect x="56" y="325.78" width="360" height="95.78" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="56" y="325.78" width="6" height="95.78" rx="3" fill="#5eead4"/><text x="74" y="361.78" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Tokens</text><text x="74" y="390.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">split into word-pieces</text><rect x="56" y="455.55999999999995" width="360" height="117.56" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="56" y="455.55999999999995" width="6" height="117.56" rx="3" fill="#5eead4"/><text x="74" y="491.55999999999995" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Embeddings</text><text x="74" y="520.06" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">each token → a vector (list of</text><text x="74" y="541.8399999999999" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">numbers) capturing meaning</text><rect x="56" y="607.1199999999999" width="360" height="95.78" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="56" y="607.1199999999999" width="6" height="95.78" rx="3" fill="#5eead4"/><text x="74" y="643.1199999999999" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">+ Position</text><text x="74" y="671.6199999999999" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">add word-order information</text><line x1="236.0" y1="295.78" x2="236.0" y2="310.8" stroke="#5eead4" stroke-width="2.6" opacity="1.0"/><polygon points="236.0,321.8 231.5,311.7 240.5,311.7" fill="#5eead4" opacity="1.0"/><line x1="236.0" y1="425.55999999999995" x2="236.0" y2="440.6" stroke="#5eead4" stroke-width="2.6" opacity="1.0"/><polygon points="236.0,451.6 231.5,441.5 240.5,441.5" fill="#5eead4" opacity="1.0"/><line x1="236.0" y1="577.1199999999999" x2="236.0" y2="592.1" stroke="#5eead4" stroke-width="2.6" opacity="1.0"/><polygon points="236.0,603.1 231.5,593.1 240.5,593.1" fill="#5eead4" opacity="1.0"/><line x1="420" y1="647.1199999999999" x2="549.0" y2="647.1" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="560.0,647.1 550.0,651.6 550.0,642.6" fill="#aab8df" opacity="1.0"/><text x="600" y="165" font-size="22" fill="#818cf8" font-weight="800" text-anchor="start" style="">Step 2 · The Transformer stack</text><rect x="600" y="196" width="470" height="600" rx="20" fill="rgba(129,140,248,0.06)" stroke="#818cf8" stroke-width="2.6" opacity="1" stroke-dasharray="2 0"/><text x="835.0" y="230" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="middle" style="">Transformer block  ×  N layers</text><text x="835.0" y="256" font-size="15" fill="#aab8df" font-weight="400" text-anchor="middle" style="">(modern models: 30 – 120+ layers)</text><rect x="628" y="280" width="414" height="150" rx="16" fill="#111733" stroke="#38bdf8" stroke-width="2.4" opacity="1"/><rect x="628" y="280" width="6" height="150" rx="3" fill="#38bdf8"/><text x="646" y="317" font-size="21" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Self-Attention</text><text x="646" y="346.0" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">Every token looks at every other token</text><text x="646" y="368.44" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">and decides which ones matter for its</text><text x="646" y="390.88" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">meaning.</text><rect x="628" y="458" width="414" height="150" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="628" y="458" width="6" height="150" rx="3" fill="#c4b5fd"/><text x="646" y="495" font-size="21" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Feed-forward network</text><text x="646" y="524.0" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">Each token is transformed and enriched</text><text x="646" y="546.44" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">on its own, mixing in what attention</text><text x="646" y="568.88" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">found.</text><rect x="628" y="636" width="414" height="120" rx="16" fill="#111733" stroke="#eef3ff" stroke-width="2.4" opacity="1"/><rect x="628" y="636" width="6" height="120" rx="3" fill="#eef3ff"/><text x="646" y="671" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Add &amp; normalize</text><text x="646" y="699.0" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Keeps the signal stable so very deep</text><text x="646" y="720.12" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">stacks can train.</text><line x1="1056" y1="766" x2="1056.0" y2="317.0" stroke="#818cf8" stroke-width="2.6" opacity="1.0" stroke-dasharray="6 6"/><polygon points="1056.0,306.0 1060.5,316.0 1051.5,316.0" fill="#818cf8" opacity="1.0"/><text x="1076" y="496.0" font-size="15" fill="#818cf8" font-weight="400" text-anchor="start" style="font-style:italic;">repeat</text><text x="1110" y="165" font-size="22" fill="#34d399" font-weight="800" text-anchor="start" style="">Step 3 · Predict</text><rect x="1110" y="196" width="434" height="120" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.4" opacity="1"/><rect x="1110" y="196" width="6" height="120" rx="3" fill="#34d399"/><text x="1128" y="232" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Probabilities over the next token</text><text x="1128" y="260.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">The stack outputs a score for every</text><text x="1128" y="282.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">possible next token.</text><rect x="1110" y="340" width="434" height="120" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.4" opacity="1"/><rect x="1110" y="340" width="6" height="120" rx="3" fill="#34d399"/><text x="1128" y="376" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Pick the next token</text><text x="1128" y="404.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Usually the most likely — with a little</text><text x="1128" y="426.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">randomness for creativity.</text><line x1="1327" y1="320" x2="1327.0" y2="325.0" stroke="#34d399" stroke-width="2.6" opacity="1.0"/><polygon points="1327.0,336.0 1322.5,326.0 1331.5,326.0" fill="#34d399" opacity="1.0"/><line x1="1074" y1="276" x2="1095.0" y2="276.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="1106.0,276.0 1096.0,280.5 1096.0,271.5" fill="#aab8df" opacity="1.0"/><line x1="1327" y1="466" x2="1327.0" y2="529.0" stroke="#34d399" stroke-width="2.6" opacity="1.0" stroke-dasharray="6 6"/><polygon points="1327.0,540.0 1322.5,530.0 1331.5,530.0" fill="#34d399" opacity="1.0"/><text x="1327" y="566" font-size="15" fill="#34d399" font-weight="400" text-anchor="middle" style="font-style:italic;">…then do it all again for the next word</text><rect x="600" y="806" width="944" height="166" rx="16" fill="#111733" stroke="#38bdf8" stroke-width="2.4" opacity="1"/><text x="620" y="836" font-size="20" fill="#38bdf8" font-weight="800" text-anchor="start" style="">What “attention” does — an example</text><text x="620" y="870" font-size="16" fill="#eef3ff" font-weight="400" text-anchor="start" style="">“The trophy didn’t fit in the suitcase because IT was too big.”</text><text x="620" y="900.0" font-size="15" fill="#aab8df" font-weight="400" text-anchor="start" style="">To understand “it”, the model attends most strongly to</text><text x="620" y="919.5" font-size="15" fill="#aab8df" font-weight="400" text-anchor="start" style="">“trophy” — not “suitcase”. Weighing context like this is</text><text x="620" y="939.0" font-size="15" fill="#aab8df" font-weight="400" text-anchor="start" style="">what lets transformers handle long, subtle sentences.</text><line x1="1168" y1="824" x2="1168" y2="954" stroke="#1c2444" stroke-width="2"/><text x="1196" y="914" font-size="19" fill="#38bdf8" font-weight="800" text-anchor="start" style="">it</text><text x="1288" y="914" font-size="19" fill="#34d399" font-weight="800" text-anchor="start" style="">trophy</text><text x="1422" y="914" font-size="17" fill="#7486b3" font-weight="400" text-anchor="start" style="">suitcase</text><path d="M 1204 898 Q 1251 862 1300 898" fill="none" stroke="#34d399" stroke-width="3"/><path d="M 1212 898 Q 1346 856 1482 898" fill="none" stroke="#7486b3" stroke-width="2" stroke-dasharray="4 4"/><text x="1236" y="872" font-size="12.5" fill="#34d399" font-weight="400" text-anchor="start" style="">strong</text><text x="1346" y="864" font-size="12.5" fill="#7486b3" font-weight="400" text-anchor="start" style="">weak</text><text x="56" y="986" font-size="17" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Origin: the Transformer was introduced in 2017 (“Attention Is All You Need”, Google). It powers Claude, GPT, Gemini, Llama, Qwen and more.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>