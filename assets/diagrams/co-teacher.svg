<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#fb7185" stop-opacity="0.10"/><stop offset="0.6" stop-color="#fb7185" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">AI as Co-Teacher: Designing Learning Together</text><text x="56" y="98" font-size="21" fill="#aab8df">The same discuss → design → create → assess → iterate loop — applied to the classroom.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><text x="56" y="165" font-size="22" fill="#fb7185" font-weight="800" text-anchor="start" style="">The teaching loop — the same shape as the engineer&#x27;s, for the classroom</text><rect x="56.0" y="210" width="330" height="150" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.6" opacity="1"/><rect x="56.0" y="210" width="6" height="150" rx="3" fill="#5eead4"/><text x="76.0" y="246" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">1  Discuss goals</text><text x="76.0" y="274" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">What should students learn? Who</text><text x="76.0" y="296" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">are they?</text><rect x="76.0" y="322" width="220" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#5eead4" stroke-width="1.5"/><text x="88.0" y="340" font-size="14" fill="#5eead4" font-weight="700" text-anchor="start" style="">Claude Desktop</text><rect x="442.0" y="210" width="330" height="150" rx="16" fill="#111733" stroke="#38bdf8" stroke-width="2.6" opacity="1"/><rect x="442.0" y="210" width="6" height="150" rx="3" fill="#38bdf8"/><text x="462.0" y="246" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">2  Design curriculum</text><text x="462.0" y="274" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">The syllabus — your “PRD” for the</text><text x="462.0" y="296" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">unit</text><rect x="462.0" y="322" width="220" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#38bdf8" stroke-width="1.5"/><text x="474.0" y="340" font-size="14" fill="#38bdf8" font-weight="700" text-anchor="start" style="">Claude Desktop</text><rect x="828.0" y="210" width="330" height="150" rx="16" fill="#111733" stroke="#818cf8" stroke-width="2.6" opacity="1"/><rect x="828.0" y="210" width="6" height="150" rx="3" fill="#818cf8"/><text x="848.0" y="246" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">3  Create materials</text><text x="848.0" y="274" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Lessons, slides, worksheets,</text><text x="848.0" y="296" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">readings</text><rect x="848.0" y="322" width="276" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#818cf8" stroke-width="1.5"/><text x="860.0" y="340" font-size="14" fill="#818cf8" font-weight="700" text-anchor="start" style="">Claude + Artifacts</text><rect x="1214.0" y="210" width="330" height="150" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.6" opacity="1"/><rect x="1214.0" y="210" width="6" height="150" rx="3" fill="#c4b5fd"/><text x="1234.0" y="246" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">4  Differentiate</text><text x="1234.0" y="274" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Adapt by level, language, IEP</text><text x="1234.0" y="296" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">needs</text><rect x="1234.0" y="322" width="220" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#c4b5fd" stroke-width="1.5"/><text x="1246.0" y="340" font-size="14" fill="#c4b5fd" font-weight="700" text-anchor="start" style="">Claude Desktop</text><rect x="1214.0" y="470" width="330" height="150" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.6" opacity="1"/><rect x="1214.0" y="470" width="6" height="150" rx="3" fill="#34d399"/><text x="1234.0" y="506" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">5  Assess</text><text x="1234.0" y="534" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Quizzes, rubrics, draft feedback</text><rect x="1234.0" y="582" width="220" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#34d399" stroke-width="1.5"/><text x="1246.0" y="600" font-size="14" fill="#34d399" font-weight="700" text-anchor="start" style="">Claude Desktop</text><rect x="635.0" y="470" width="330" height="150" rx="16" fill="#111733" stroke="#a3e635" stroke-width="2.6" opacity="1"/><rect x="635.0" y="470" width="6" height="150" rx="3" fill="#a3e635"/><text x="655.0" y="506" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">6  Review results</text><text x="655.0" y="534" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">See what worked; spot gaps</text><rect x="655.0" y="582" width="276" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#a3e635" stroke-width="1.5"/><text x="667.0" y="600" font-size="14" fill="#a3e635" font-weight="700" text-anchor="start" style="">Claude + your data</text><rect x="56.0" y="470" width="330" height="150" rx="16" fill="#111733" stroke="#fbbf24" stroke-width="2.6" opacity="1"/><rect x="56.0" y="470" width="6" height="150" rx="3" fill="#fbbf24"/><text x="76.0" y="506" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="start" style="">7  Iterate</text><text x="76.0" y="534" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Revise next time around</text><rect x="76.0" y="582" width="220" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="#fbbf24" stroke-width="1.5"/><text x="88.0" y="600" font-size="14" fill="#fbbf24" font-weight="700" text-anchor="start" style="">back to step 1</text><line x1="392.0" y1="285.0" x2="425.0" y2="285.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="436.0,285.0 426.0,289.5 426.0,280.5" fill="#aab8df" opacity="1.0"/><line x1="778.0" y1="285.0" x2="811.0" y2="285.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="822.0,285.0 812.0,289.5 812.0,280.5" fill="#aab8df" opacity="1.0"/><line x1="1164.0" y1="285.0" x2="1197.0" y2="285.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="1208.0,285.0 1198.0,289.5 1198.0,280.5" fill="#aab8df" opacity="1.0"/><line x1="1379.0" y1="366" x2="1379.0" y2="453.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="1379.0,464.0 1374.5,454.0 1383.5,454.0" fill="#aab8df" opacity="1.0"/><line x1="1208.0" y1="545.0" x2="982.0" y2="545.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="971.0,545.0 981.0,540.5 981.0,549.5" fill="#aab8df" opacity="1.0"/><line x1="629.0" y1="545.0" x2="403.0" y2="545.0" stroke="#aab8df" stroke-width="2.6" opacity="1.0"/><polygon points="392.0,545.0 402.0,540.5 402.0,549.5" fill="#aab8df" opacity="1.0"/><line x1="221.0" y1="626" x2="221.0" y2="639.0" stroke="#fbbf24" stroke-width="2.6" opacity="1.0"/><polygon points="221.0,650.0 216.5,640.0 225.5,640.0" fill="#fbbf24" opacity="1.0"/><path d="M 221.0 650 L 38 650 L 38 184 L 221.0 184" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-dasharray="7 6"/><line x1="221.0" y1="184" x2="221.0" y2="193.0" stroke="#fbbf24" stroke-width="2.6" opacity="1.0"/><polygon points="221.0,204.0 216.5,194.0 225.5,194.0" fill="#fbbf24" opacity="1.0"/><text x="250" y="638" font-size="15" fill="#fbbf24" font-weight="400" text-anchor="start" style="font-style:italic;">iterate every term</text><rect x="444" y="366" width="712" height="98" rx="16" fill="rgba(251,113,133,0.10)" stroke="#fb7185" stroke-width="2.4" opacity="1"/><text x="800" y="396" font-size="20" fill="#eef3ff" font-weight="800" text-anchor="middle" style="">The teacher stays in charge</text><text x="800" y="424" font-size="16" fill="#fb7185" font-weight="400" text-anchor="middle" style="">YOU: pedagogy, judgment, relationships, care.</text><text x="800" y="448" font-size="16" fill="#aab8df" font-weight="400" text-anchor="middle" style="">AI: drafts, variations, reading-level swaps, grading help.</text><text x="56" y="720" font-size="22" fill="#818cf8" font-weight="800" text-anchor="start" style="">Artifacts it can produce in minutes</text><rect x="56" y="744" width="133" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="122.5" y="768.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">lesson plan</text><rect x="201" y="744" width="124" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="263.0" y="768.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">slide deck</text><rect x="337" y="744" width="114" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="394.0" y="768.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">worksheet</text><rect x="463" y="744" width="124" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="525.0" y="768.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">quiz + key</text><rect x="599" y="744" width="85" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="641.5" y="768.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">rubric</text><rect x="696" y="744" width="143" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="767.5" y="768.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">parent email</text><rect x="851" y="744" width="220" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="961.0" y="768.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">reading at any level</text><rect x="56" y="824" width="1488" height="150" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.4" opacity="1"/><text x="76" y="856" font-size="20" fill="#34d399" font-weight="800" text-anchor="start" style="">A concrete pass:  “A 2-week unit on fractions for a mixed-ability 4th grade.”</text><text x="76" y="892" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">1) Discuss goals  →  2) Claude drafts the unit plan  →  3) generates daily lessons, slides and worksheets  →  4) makes easier &amp;</text><text x="76" y="920" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">    harder versions of each  →  5) builds a quiz with a rubric  →  6) you teach, then share results  →  7) Claude tunes next year&#x27;s unit.</text><text x="76" y="952" font-size="16" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Notice: it is the very same loop as the engineer&#x27;s. The method travels across fields.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>