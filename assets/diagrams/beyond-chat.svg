<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.10"/><stop offset="0.6" stop-color="#38bdf8" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">Beyond the Chat Box</text><text x="56" y="98" font-size="21" fill="#aab8df">Spreadsheets, documents, voice, video, your own files.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><text x="56" y="165" font-size="22" fill="#38bdf8" font-weight="800" text-anchor="start" style="">The chat box is the doorway, not the room.</text><circle cx="800" cy="560" r="118" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="3"/><text x="800" y="550" font-size="22" fill="#eef3ff" font-weight="800" text-anchor="middle" style="">The chat box</text><text x="800" y="578" font-size="15" fill="#aab8df" font-weight="400" text-anchor="middle" style="">where it started</text><rect x="100" y="215" width="330" height="112" rx="16" fill="#111733" stroke="#5eead4" stroke-width="2.4" opacity="1"/><rect x="100" y="215" width="6" height="112" rx="3" fill="#5eead4"/><text x="118" y="249" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🌐 The web</text><text x="118" y="275.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">looks things up and cites where it</text><text x="118" y="294.64" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">looked</text><line x1="688.1473889624793" y1="511.28661986590225" x2="274.2" y2="331.0" stroke="#5eead4" stroke-width="2" opacity="1.0" stroke-dasharray="5 5"/><polygon points="265.0,327.0 275.0,326.9 271.7,334.4" fill="#5eead4" opacity="1.0"/><rect x="635" y="195" width="330" height="112" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.4" opacity="1"/><rect x="635" y="195" width="6" height="112" rx="3" fill="#34d399"/><text x="653" y="229" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="start" style="">📊 Spreadsheets</text><text x="653" y="255.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">builds the sign-up sheet inside</text><text x="653" y="274.64" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Excel, formulas and all</text><line x1="800.0" y1="438.0" x2="800.0" y2="317.0" stroke="#34d399" stroke-width="2" opacity="1.0" stroke-dasharray="5 5"/><polygon points="800.0,307.0 804.1,316.1 795.9,316.1" fill="#34d399" opacity="1.0"/><rect x="1170" y="215" width="330" height="112" rx="16" fill="#111733" stroke="#818cf8" stroke-width="2.4" opacity="1"/><rect x="1170" y="215" width="6" height="112" rx="3" fill="#818cf8"/><text x="1188" y="249" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="start" style="">📄 Documents</text><text x="1188" y="275.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">drafts and edits in Word; the study</text><text x="1188" y="294.64" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">guide, the letter</text><line x1="911.8526110375207" y1="511.2866198659022" x2="1325.8" y2="331.0" stroke="#818cf8" stroke-width="2" opacity="1.0" stroke-dasharray="5 5"/><polygon points="1335.0,327.0 1328.3,334.4 1325.0,326.9" fill="#818cf8" opacity="1.0"/><rect x="56" y="505" width="330" height="112" rx="16" fill="#111733" stroke="#fb923c" stroke-width="2.4" opacity="1"/><rect x="56" y="505" width="6" height="112" rx="3" fill="#fb923c"/><text x="74" y="539" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="start" style="">📅 Calendar &amp; mail</text><text x="74" y="565.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">finds the open evening, drafts the</text><text x="74" y="584.64" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">reminder</text><line x1="678.0003558993972" y1="560.2946851306777" x2="396.0" y2="561.0" stroke="#fb923c" stroke-width="2" opacity="1.0" stroke-dasharray="5 5"/><polygon points="386.0,561.0 395.1,556.9 395.1,565.1" fill="#fb923c" opacity="1.0"/><rect x="1214" y="505" width="330" height="112" rx="16" fill="#111733" stroke="#fb7185" stroke-width="2.4" opacity="1"/><rect x="1214" y="505" width="6" height="112" rx="3" fill="#fb7185"/><text x="1232" y="539" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🎙️ Your voice</text><text x="1232" y="565.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">speak three memories; it listens and</text><text x="1232" y="584.64" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">organizes</text><line x1="921.9996441006028" y1="560.2946851306777" x2="1204.0" y2="561.0" stroke="#fb7185" stroke-width="2" opacity="1.0" stroke-dasharray="5 5"/><polygon points="1214.0,561.0 1204.9,565.1 1204.9,556.9" fill="#fb7185" opacity="1.0"/><rect x="330" y="800" width="330" height="112" rx="16" fill="#111733" stroke="#fbbf24" stroke-width="2.4" opacity="1"/><rect x="330" y="800" width="6" height="112" rx="3" fill="#fbbf24"/><text x="348" y="834" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🗂️ Your files</text><text x="348" y="860.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">reads the brochure on your Mac;</text><text x="348" y="879.64" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">nothing uploaded</text><line x1="704.1237277265003" y1="635.4436240840653" x2="502.9" y2="793.8" stroke="#fbbf24" stroke-width="2" opacity="1.0" stroke-dasharray="5 5"/><polygon points="495.0,800.0 499.7,791.1 504.7,797.6" fill="#fbbf24" opacity="1.0"/><rect x="940" y="800" width="330" height="112" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="940" y="800" width="6" height="112" rx="3" fill="#c4b5fd"/><text x="958" y="834" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🎬 Short video</text><text x="958" y="860.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">a 20-second explainer from a</text><text x="958" y="879.64" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">paragraph</text><line x1="895.8762722734997" y1="635.4436240840653" x2="1097.1" y2="793.8" stroke="#c4b5fd" stroke-width="2" opacity="1.0" stroke-dasharray="5 5"/><polygon points="1105.0,800.0 1095.3,797.6 1100.3,791.1" fill="#c4b5fd" opacity="1.0"/><text x="56" y="986" font-size="17" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Rule of thumb: if you are copying and pasting between the chat and another program, there is probably a better way.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>