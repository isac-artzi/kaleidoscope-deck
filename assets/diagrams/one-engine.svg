<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0.10"/><stop offset="0.6" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">One Engine, Many Libraries</text><text x="56" y="98" font-size="21" fill="#aab8df">The same companion, a different bookshelf.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><text x="56" y="165" font-size="22" fill="#c4b5fd" font-weight="800" text-anchor="start" style="">Same program. Flip one switch. Different bookshelf.</text><rect x="120" y="200" width="560" height="120" rx="16" fill="#111733" stroke="#38bdf8" stroke-width="2.4" opacity="1"/><rect x="120" y="200" width="6" height="120" rx="3" fill="#38bdf8"/><text x="138" y="238" font-size="22" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Halachic Companion</text><text x="138" y="266.0" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Talmud, Mishnah, Shulchan Aruch, responsa — via the Sefaria</text><text x="138" y="287.12" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">library</text><rect x="920" y="200" width="560" height="120" rx="16" fill="#111733" stroke="#a3e635" stroke-width="2.4" opacity="1"/><rect x="920" y="200" width="6" height="120" rx="3" fill="#a3e635"/><text x="938" y="238" font-size="22" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Bible Companion</text><text x="938" y="266.0" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Scripture, Strong&#x27;s, Matthew Henry, Calvin, the Westminster</text><text x="938" y="287.12" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Standards</text><rect x="400" y="400" width="800" height="300" rx="24" fill="rgba(196,181,253,0.06)" stroke="#c4b5fd" stroke-width="3" opacity="1"/><text x="800" y="444" font-size="26" fill="#c4b5fd" font-weight="800" text-anchor="middle" style="">ONE ENGINE</text><text x="800" y="472" font-size="16" fill="#aab8df" font-weight="400" text-anchor="middle" style="">find · read · write · cite — identical for both</text><text x="440" y="510" font-size="17" fill="#eef3ff" font-weight="800" text-anchor="start" style="">Library</text><rect x="440" y="522" width="330" height="54" rx="27" fill="#111733" stroke="#1c2444" stroke-width="2" opacity="1"/><rect x="444" y="526" width="160" height="46" rx="23" fill="rgba(56,189,248,0.22)" stroke="#38bdf8" stroke-width="2" opacity="1"/><text x="524" y="555" font-size="17" fill="#38bdf8" font-weight="800" text-anchor="middle" style="">Sefaria</text><text x="688" y="555" font-size="16" fill="#aab8df" font-weight="400" text-anchor="middle" style="">Bible + Reformed</text><text x="440" y="606" font-size="14" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">flips in about one second, no restart</text><text x="820" y="510" font-size="17" fill="#eef3ff" font-weight="800" text-anchor="start" style="">Brain</text><rect x="820" y="522" width="340" height="54" rx="27" fill="#111733" stroke="#1c2444" stroke-width="2" opacity="1"/><text x="878" y="555" font-size="16" fill="#34d399" font-weight="800" text-anchor="middle" style="">⌂ Local</text><text x="990" y="555" font-size="16" fill="#818cf8" font-weight="800" text-anchor="middle" style="">☁ Cloud</text><text x="1102" y="555" font-size="16" fill="#fbbf24" font-weight="800" text-anchor="middle" style="">Auto</text><text x="820" y="606" font-size="14" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">🔒 privacy lock: nothing leaves this Mac</text><line x1="600" y1="394" x2="410.4" y2="329.5" stroke="#38bdf8" stroke-width="2.6" opacity="1.0" stroke-dasharray="6 6"/><polygon points="400.0,326.0 411.0,325.0 408.1,333.5" fill="#38bdf8" opacity="1.0"/><line x1="1000" y1="394" x2="1189.6" y2="329.5" stroke="#a3e635" stroke-width="2.6" opacity="1.0" stroke-dasharray="6 6"/><polygon points="1200.0,326.0 1191.9,333.5 1189.0,325.0" fill="#a3e635" opacity="1.0"/><text x="56" y="770" font-size="22" fill="#5eead4" font-weight="800" text-anchor="start" style="">The method is portable. The library is your choice.</text><rect x="56" y="794" width="268" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#5eead4" stroke-width="2" opacity="1"/><text x="190.0" y="818.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">your profession&#x27;s manuals</text><rect x="336" y="794" width="268" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#5eead4" stroke-width="2" opacity="1"/><text x="470.0" y="818.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">a hobby&#x27;s reference books</text><rect x="616" y="794" width="344" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#5eead4" stroke-width="2" opacity="1"/><text x="788.0" y="818.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">your family&#x27;s letters and history</text><rect x="972" y="794" width="210" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#5eead4" stroke-width="2" opacity="1"/><text x="1077.0" y="818.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">a church&#x27;s archives</text><rect x="1194" y="794" width="210" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#5eead4" stroke-width="2" opacity="1"/><text x="1299.0" y="818.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">any shelf you trust</text><text x="56" y="986" font-size="17" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Nothing about the engine knows which faith it is reading. That is the point: you choose the bookshelf, not the computer.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>