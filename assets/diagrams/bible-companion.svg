<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#a3e635" stop-opacity="0.10"/><stop offset="0.6" stop-color="#a3e635" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">Bible Companion</text><text x="56" y="98" font-size="21" fill="#aab8df">A study partner that always shows its sources.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><text x="56" y="165" font-size="22" fill="#a3e635" font-weight="800" text-anchor="start" style="">A question goes in. Only what the library actually says comes out.</text><rect x="56" y="200" width="340" height="170" rx="16" fill="#111733" stroke="#38bdf8" stroke-width="2.4" opacity="1"/><rect x="56" y="200" width="6" height="170" rx="3" fill="#38bdf8"/><text x="74" y="236" font-size="20" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Your question</text><text x="74" y="264.0" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">“What does agape mean in John</text><text x="74" y="285.12" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">21:15–17, and what did Matthew</text><text x="74" y="306.24" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Henry say about it?”</text><rect x="456" y="200" width="380" height="360" rx="20" fill="rgba(163,230,53,0.06)" stroke="#a3e635" stroke-width="2.6" opacity="1"/><text x="646.0" y="236" font-size="21" fill="#eef3ff" font-weight="800" text-anchor="middle" style="">The companion engine</text><rect x="476" y="256" width="340" height="110.28" rx="16" fill="#111733" stroke="#a3e635" stroke-width="2.4" opacity="1"/><rect x="476" y="256" width="6" height="110.28" rx="3" fill="#a3e635"/><text x="494" y="290" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="start" style="">1 · Find</text><text x="494" y="316.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Searches the library for the passage,</text><text x="494" y="335.64" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">the Greek word, and the commentary</text><rect x="476" y="378.28" width="340" height="110.28" rx="16" fill="#111733" stroke="#a3e635" stroke-width="2.4" opacity="1"/><rect x="476" y="378.28" width="6" height="110.28" rx="3" fill="#a3e635"/><text x="494" y="412.28" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="start" style="">2 · Read</text><text x="494" y="438.78" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Pulls the exact verses and paragraphs,</text><text x="494" y="457.91999999999996" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">nothing from memory</text><rect x="476" y="500.55999999999995" width="340" height="110.28" rx="16" fill="#111733" stroke="#a3e635" stroke-width="2.4" opacity="1"/><rect x="476" y="500.55999999999995" width="6" height="110.28" rx="3" fill="#a3e635"/><text x="494" y="534.56" font-size="18" fill="#eef3ff" font-weight="700" text-anchor="start" style="">3 · Write</text><text x="494" y="561.06" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Composes an answer that cites every</text><text x="494" y="580.1999999999999" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">source it used</text><line x1="404" y1="285" x2="437.0" y2="285.0" stroke="#38bdf8" stroke-width="2.6" opacity="1.0"/><polygon points="448.0,285.0 438.0,289.5 438.0,280.5" fill="#38bdf8" opacity="1.0"/><text x="896" y="190" font-size="22" fill="#fbbf24" font-weight="800" text-anchor="start" style="">The library · all public domain</text><rect x="896" y="212" width="648" height="100" rx="16" fill="#111733" stroke="#fbbf24" stroke-width="2.4" opacity="1"/><rect x="896" y="212" width="6" height="100" rx="3" fill="#fbbf24"/><text x="914" y="247" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Scripture</text><text x="914" y="274.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Berean Standard Bible · King James · ASV · World English</text><line x1="888" y1="262.0" x2="852.9" y2="280.4" stroke="#fbbf24" stroke-width="2" opacity="1.0" stroke-dasharray="5 5"/><polygon points="844.0,285.0 850.2,277.2 854.0,284.4" fill="#fbbf24" opacity="1.0"/><rect x="896" y="326" width="648" height="100" rx="16" fill="#111733" stroke="#fb923c" stroke-width="2.4" opacity="1"/><rect x="896" y="326" width="6" height="100" rx="3" fill="#fb923c"/><text x="914" y="361" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Original words</text><text x="914" y="388.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Strong&#x27;s Hebrew &amp; Greek dictionaries</text><line x1="888" y1="376.0" x2="848.4" y2="294.0" stroke="#fb923c" stroke-width="2" opacity="1.0" stroke-dasharray="5 5"/><polygon points="844.0,285.0 851.6,291.4 844.3,295.0" fill="#fb923c" opacity="1.0"/><rect x="896" y="440" width="648" height="113.92" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="896" y="440" width="6" height="113.92" rx="3" fill="#c4b5fd"/><text x="914" y="475" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Reformed bookshelf</text><text x="914" y="502.5" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Matthew Henry · Calvin&#x27;s Institutes · Westminster Standards ·</text><text x="914" y="522.96" font-size="15.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Heidelberg Catechism · the Creeds</text><line x1="888" y1="496.96" x2="846.0" y2="294.8" stroke="#c4b5fd" stroke-width="2" opacity="1.0" stroke-dasharray="5 5"/><polygon points="844.0,285.0 849.8,293.1 841.9,294.8" fill="#c4b5fd" opacity="1.0"/><text x="896" y="579.92" font-size="14.5" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Not in the library: ESV, NIV, NASB, publisher&#x27;s study notes.</text><rect x="56" y="600" width="780" height="230" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.4" opacity="1"/><rect x="56" y="600" width="6" height="230" rx="3" fill="#34d399"/><text x="74" y="637" font-size="21" fill="#eef3ff" font-weight="700" text-anchor="start" style="">The answer, with its receipts</text><text x="74" y="665.0" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Agapaō (G25) vs phileō (G5368): Jesus asks with one word, Peter answers with the</text><text x="74" y="686.12" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">other — John 21:15–17 (BSB, KJV).</text><text x="74" y="707.24" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Henry on John 21: Peter was grieved at the third asking; the threefold question</text><text x="74" y="728.36" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">answers the threefold denial — cited to the chapter.</text><text x="74" y="749.48" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Every reference is a link. Click it, read the verse yourself.</text><line x1="646.0" y1="566" x2="646.0" y2="583.0" stroke="#a3e635" stroke-width="2.6" opacity="1.0"/><polygon points="646.0,594.0 641.5,584.0 650.5,584.0" fill="#a3e635" opacity="1.0"/><rect x="876" y="600" width="668" height="230" rx="16" fill="#111733" stroke="#a3e635" stroke-width="2.6" opacity="1"/><rect x="876" y="600" width="668" height="46" rx="16" fill="rgba(163,230,53,0.14)"/><text x="896" y="630" font-size="19" fill="#a3e635" font-weight="800" text-anchor="start" style="">Berean check  ·  what it actually read</text><circle cx="904" cy="670" r="5" fill="#fbbf24"/><text x="920" y="676" font-size="16" fill="#eef3ff" font-weight="400" text-anchor="start" style="">John 21:15</text><text x="1520" y="676" font-size="14" fill="#aab8df" font-weight="400" text-anchor="end" style="">BSB · KJV</text><circle cx="904" cy="706" r="5" fill="#fb923c"/><text x="920" y="712" font-size="16" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Strong&#x27;s G25 · G5368</text><text x="1520" y="712" font-size="14" fill="#aab8df" font-weight="400" text-anchor="end" style="">lexicon</text><circle cx="904" cy="742" r="5" fill="#c4b5fd"/><text x="920" y="748" font-size="16" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Henry, John 21 §1</text><text x="1520" y="748" font-size="14" fill="#aab8df" font-weight="400" text-anchor="end" style="">commentary</text><circle cx="904" cy="778" r="5" fill="#fbbf24"/><text x="920" y="784" font-size="16" fill="#eef3ff" font-weight="400" text-anchor="start" style="">Cross-refs: John 13:37, 1 Pet 1:8</text><text x="1520" y="784" font-size="14" fill="#aab8df" font-weight="400" text-anchor="end" style="">BSB</text><text x="896" y="812" font-size="14.5" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">If this panel is empty, the companion says so instead of guessing.</text><text x="56" y="862" font-size="22" fill="#fb7185" font-weight="800" text-anchor="start" style="">Three things it will not do</text><rect x="56" y="880" width="480" height="90.14" rx="16" fill="#111733" stroke="#fb7185" stroke-width="2.4" opacity="1"/><rect x="56" y="880" width="6" height="90.14" rx="3" fill="#fb7185"/><text x="74" y="913" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Pastoral counsel</text><text x="74" y="939.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">“That is a conversation for your pastor or an elder.”</text><rect x="560" y="880" width="480" height="90.14" rx="16" fill="#111733" stroke="#fb7185" stroke-width="2.4" opacity="1"/><rect x="560" y="880" width="6" height="90.14" rx="3" fill="#fb7185"/><text x="578" y="913" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Denominational verdicts</text><text x="578" y="939.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Shows the texts side by side, then stops.</text><rect x="1064" y="880" width="480" height="90.14" rx="16" fill="#111733" stroke="#fb7185" stroke-width="2.4" opacity="1"/><rect x="1064" y="880" width="6" height="90.14" rx="3" fill="#fb7185"/><text x="1082" y="913" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Someone else&#x27;s private situation</text><text x="1082" y="939.5" font-size="14.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Declines, and reminds you why.</text><text x="56" y="986" font-size="17" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">It finds and quotes; you interpret. That order is the design, not a limitation.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>