<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#818cf8" stop-opacity="0.10"/><stop offset="0.6" stop-color="#818cf8" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">What&#x27;s Next: 2 Years &amp; the Next Decade</text><text x="56" y="98" font-size="21" fill="#aab8df">Two horizons across capabilities, hardware, and society — with the open questions that come with them.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><line x1="56" y1="150" x2="56" y2="900" stroke="#1c2444" stroke-width="2"/><rect x="120" y="150" width="660" height="44" rx="12" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="2" opacity="1"/><text x="450" y="180" font-size="22" fill="#38bdf8" font-weight="800" text-anchor="middle" style="">NEXT 2 YEARS   ·   2026 – 2028</text><rect x="820" y="150" width="724" height="44" rx="12" fill="rgba(129,140,248,0.10)" stroke="#818cf8" stroke-width="2" opacity="1"/><text x="1182" y="180" font-size="22" fill="#818cf8" font-weight="800" text-anchor="middle" style="">THE NEXT DECADE   ·   to ~2036</text><text transform="rotate(-90 90 313)" x="90" y="313" font-size="19" fill="#5eead4" font-weight="800" text-anchor="middle">Capabilities</text><rect x="120" y="220" width="660" height="186" rx="14" fill="#111733" stroke="#5eead4" stroke-width="2.2" opacity="1"/><text x="140" y="256" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Agents that do multi-step tasks for you</text><text x="140" y="288" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Stronger reasoning &amp; planning</text><text x="140" y="320" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Native voice &amp; video (truly multimodal)</text><text x="140" y="352" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Long-term memory of your context</text><text x="140" y="384" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Reliable tool use (it checks its own work)</text><rect x="820" y="220" width="724" height="186" rx="14" fill="#111733" stroke="#5eead4" stroke-width="2.2" opacity="1"/><text x="840" y="256" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Autonomous research &amp; “AI scientists”</text><text x="840" y="288" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Embodied AI — robots that learn by doing</text><text x="840" y="320" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• A personal tutor / advisor for everyone</text><text x="840" y="352" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• World models that simulate &amp; plan</text><text x="840" y="384" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Ongoing debate: how close is AGI?</text><line x1="784" y1="313.0" x2="804.0" y2="313.0" stroke="#5eead4" stroke-width="2.6" opacity="1.0"/><polygon points="816.0,313.0 805.0,317.9 805.0,308.1" fill="#5eead4" opacity="1.0"/><text transform="rotate(-90 90 523)" x="90" y="523" font-size="19" fill="#fb923c" font-weight="800" text-anchor="middle">Hardware</text><rect x="120" y="430" width="660" height="186" rx="14" fill="#111733" stroke="#fb923c" stroke-width="2.2" opacity="1"/><text x="140" y="466" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Inference gets much cheaper &amp; faster</text><text x="140" y="498" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Capable models running on your phone</text><text x="140" y="530" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• NVIDIA Blackwell, Google TPU, custom chips</text><text x="140" y="562" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• AI woven into every app you already use</text><rect x="820" y="430" width="724" height="186" rx="14" fill="#111733" stroke="#fb923c" stroke-width="2.2" opacity="1"/><text x="840" y="466" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Huge compute &amp; energy build-out</text><text x="840" y="498" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• New silicon: wafer-scale, photonics</text><text x="840" y="530" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Robotics manufactured at scale</text><text x="840" y="562" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Open models (Llama, Qwen, DeepSeek) keep pace</text><line x1="784" y1="523.0" x2="804.0" y2="523.0" stroke="#fb923c" stroke-width="2.6" opacity="1.0"/><polygon points="816.0,523.0 805.0,527.9 805.0,518.1" fill="#fb923c" opacity="1.0"/><text transform="rotate(-90 90 733)" x="90" y="733" font-size="19" fill="#fb7185" font-weight="800" text-anchor="middle">Society &amp; trust</text><rect x="120" y="640" width="660" height="186" rx="14" fill="#111733" stroke="#fb7185" stroke-width="2.2" opacity="1"/><text x="140" y="676" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• AI assistants in most jobs &amp; products</text><text x="140" y="708" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Regulation &amp; safety standards maturing</text><text x="140" y="740" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Provenance tools — “was this AI-made?”</text><text x="140" y="772" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• New skills: directing AI well</text><rect x="820" y="640" width="724" height="186" rx="14" fill="#111733" stroke="#fb7185" stroke-width="2.2" opacity="1"/><text x="840" y="676" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Education &amp; healthcare reshaped</text><text x="840" y="708" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Big shifts in how work is done</text><text x="840" y="740" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Open questions: jobs, fairness, governance</text><text x="840" y="772" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">• Alignment: keeping powerful AI on our side</text><line x1="784" y1="733.0" x2="804.0" y2="733.0" stroke="#fb7185" stroke-width="2.6" opacity="1.0"/><polygon points="816.0,733.0 805.0,737.9 805.0,728.1" fill="#fb7185" opacity="1.0"/><text x="56" y="880" font-size="22" fill="#fbbf24" font-weight="800" text-anchor="start" style="">Who&#x27;s racing to build it</text><rect x="56" y="902" width="114" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="113.0" y="926.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">Anthropic</text><rect x="182" y="902" width="85" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="224.5" y="926.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">OpenAI</text><rect x="279" y="902" width="172" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="365.0" y="926.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">Google DeepMind</text><rect x="463" y="902" width="66" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="496.0" y="926.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">Meta</text><rect x="541" y="902" width="56" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="569.0" y="926.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">xAI</text><rect x="609" y="902" width="85" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="651.5" y="926.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">NVIDIA</text><rect x="706" y="902" width="152" height="38" rx="19.0" fill="rgba(255,255,255,0.04)" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="782.0" y="926.3333333333334" font-size="16" fill="#eef3ff" font-weight="600" text-anchor="middle" style="">+ open models</text><text x="56" y="986" font-size="17" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Predictions are uncertain — experts disagree on timelines. The safe bet: AI becomes more capable, more agentic, and more woven into daily life.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>