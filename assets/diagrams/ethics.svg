<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="1040" fill="#0a0e1c"/><rect width="1600" height="1040" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0.10"/><stop offset="0.6" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">How Does It Know — and Why Trust It?</text><text x="56" y="98" font-size="21" fill="#aab8df">AI is confident-sounding prediction. Trust is earned by verifying, not by assuming.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><rect x="56" y="200" width="728" height="248" rx="16" fill="#111733" stroke="#fbbf24" stroke-width="2.4" opacity="1"/><rect x="56" y="200" width="6" height="248" rx="3" fill="#fbbf24"/><text x="74" y="238" font-size="22" fill="#eef3ff" font-weight="700" text-anchor="start" style="">A · How does it “know”?</text><text x="74" y="267.0" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">Trained on a vast slice of human writing — so it is a statistical echo of</text><text x="74" y="289.44" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">humanity: our knowledge, but also our biases and mistakes.</text><text x="74" y="311.88" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">It predicts plausible text. It has no built-in fact-checker and no</text><text x="74" y="334.32" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">understanding of truth.</text><rect x="816" y="200" width="728" height="248" rx="16" fill="#111733" stroke="#fb7185" stroke-width="2.4" opacity="1"/><rect x="816" y="200" width="6" height="248" rx="3" fill="#fb7185"/><text x="834" y="238" font-size="22" fill="#eef3ff" font-weight="700" text-anchor="start" style="">B · Where errors come from</text><text x="834" y="266.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Hallucination — it can invent facts, names, citations.</text><text x="834" y="288.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Stale data — it stops learning at a training cutoff.</text><text x="834" y="310.06" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Bias — it reflects patterns in its data.</text><text x="834" y="331.84000000000003" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Sycophancy — it may tell you what you want to hear.</text><text x="834" y="353.62" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Shaped by its makers — choices you can&#x27;t see.</text><rect x="56" y="478" width="728" height="248" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="56" y="478" width="6" height="248" rx="3" fill="#c4b5fd"/><text x="74" y="516" font-size="22" fill="#eef3ff" font-weight="700" text-anchor="start" style="">C · Why the skepticism is fair</text><text x="74" y="545.0" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">You already discount media, politicians, salespeople and lawyers — because</text><text x="74" y="567.44" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">their output can be confidently wrong or quietly shaped.</text><text x="74" y="589.88" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">Treat AI the same way. Confidence is NOT correctness — a fluent answer can</text><text x="74" y="612.32" font-size="17" fill="#aab8df" font-weight="400" text-anchor="start" style="">still be false.</text><rect x="816" y="478" width="728" height="248" rx="16" fill="#111733" stroke="#34d399" stroke-width="2.4" opacity="1"/><rect x="816" y="478" width="6" height="248" rx="3" fill="#34d399"/><text x="834" y="516" font-size="22" fill="#eef3ff" font-weight="700" text-anchor="start" style="">D · How trust is earned — verify</text><text x="834" y="544.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Ask for sources &amp; citations (and check them).</text><text x="834" y="566.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Make it show its reasoning and assumptions.</text><text x="834" y="588.06" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Let it use tools — search, code, calculators — to check itself.</text><text x="834" y="609.84" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Cross-check anything high-stakes with a human expert.</text><text x="834" y="631.62" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Prefer systems that are transparent about limits.</text><text x="56" y="800" font-size="22" fill="#38bdf8" font-weight="800" text-anchor="start" style="">When to lean in vs. when to verify</text><defs><linearGradient id="dial" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs><rect x="56" y="826" width="1488" height="70" rx="35" fill="url(#dial)" stroke="none" stroke-width="0" opacity="0.85"/><text x="110" y="868" font-size="20" fill="#06301f" font-weight="800" text-anchor="start" style="">LEAN IN</text><text x="300" y="868" font-size="16" fill="#0b2a12" font-weight="400" text-anchor="start" style="">brainstorming · drafts · summaries · creative work · explanations</text><text x="960" y="868" font-size="20" fill="#3a1010" font-weight="800" text-anchor="start" style="">VERIFY</text><text x="1080" y="868" font-size="16" fill="#3a1010" font-weight="400" text-anchor="start" style="">facts · medical · legal · financial decisions</text><text x="56" y="956" font-size="18" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Bottom line: AI is a brilliant, fast, fallible assistant. Trust it the way you&#x27;d trust a sharp intern — useful, but you sign off.</text><text x="56" y="986" font-size="16" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">Provenance &amp; verification tools (citations, source links, tool-use) are how good AI products turn black-box answers into checkable ones.</text><text x="56" y="1014" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="1014" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>