<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="1600" height="840" fill="#0a0e1c"/><rect width="1600" height="840" fill="url(#glow)"/><defs><radialGradient id="glow" cx="78%" cy="0%" r="80%"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.10"/><stop offset="0.6" stop-color="#38bdf8" stop-opacity="0"/></radialGradient></defs><text x="56" y="64" font-size="40" font-weight="800" fill="#eef3ff">What Makes a Device “AI-Enabled”?</text><text x="56" y="98" font-size="21" fill="#aab8df">Sensors feed a trained model, which decides or acts — on the device, in the cloud, or both.</text><line x1="56" y1="116" x2="1544" y2="116" stroke="#1c2444" stroke-width="2"/><text x="800" y="165" font-size="22" fill="#eef3ff" font-weight="800" text-anchor="middle" style="">The core loop</text><path d="M 800 280 Q 910 366 930 505" fill="none" stroke="#aab8df" stroke-width="3"/><line x1="910.4182389825161" y1="366.25" x2="928.1" y2="492.1" stroke="#aab8df" stroke-width="0.1" opacity="1.0"/><polygon points="929.9,505.0 923.0,494.0 933.5,492.5" fill="#aab8df" opacity="1.0"/><path d="M 930 505 Q 800 558 670 505" fill="none" stroke="#aab8df" stroke-width="3"/><line x1="800.0" y1="557.5" x2="682.1" y2="509.9" stroke="#aab8df" stroke-width="0.1" opacity="1.0"/><polygon points="670.1,505.0 683.1,504.5 679.1,514.4" fill="#aab8df" opacity="1.0"/><path d="M 670 505 Q 690 366 800 280" fill="none" stroke="#aab8df" stroke-width="3"/><line x1="689.5817610174839" y1="366.25" x2="789.8" y2="288.0" stroke="#aab8df" stroke-width="0.1" opacity="1.0"/><polygon points="800.0,280.0 793.9,291.5 787.4,283.1" fill="#aab8df" opacity="1.0"/><circle cx="800" cy="280" r="58" fill="#111733" stroke="#38bdf8" stroke-width="3"/><text x="800.0" y="278.0" font-size="20" fill="#eef3ff" font-weight="800" text-anchor="middle" style="">Sense</text><text x="800.0" y="298.0" font-size="12.5" fill="#aab8df" font-weight="400" text-anchor="middle" style="">camera · mic · GPS</text><circle cx="930" cy="505" r="58" fill="#111733" stroke="#5eead4" stroke-width="3"/><text x="929.9038105676658" y="503.0" font-size="20" fill="#eef3ff" font-weight="800" text-anchor="middle" style="">Model</text><text x="929.9038105676658" y="523.0" font-size="12.5" fill="#aab8df" font-weight="400" text-anchor="middle" style="">recognize / predict</text><circle cx="670" cy="505" r="58" fill="#111733" stroke="#34d399" stroke-width="3"/><text x="670.0961894323342" y="503.0" font-size="20" fill="#eef3ff" font-weight="800" text-anchor="middle" style="">Act</text><text x="670.0961894323342" y="523.0" font-size="12.5" fill="#aab8df" font-weight="400" text-anchor="middle" style="">respond · adjust · alert</text><text x="56" y="165" font-size="22" fill="#fbbf24" font-weight="800" text-anchor="start" style="">Where the AI runs</text><rect x="56" y="196" width="420" height="150" rx="16" fill="#111733" stroke="#fbbf24" stroke-width="2.4" opacity="1"/><rect x="56" y="196" width="6" height="150" rx="3" fill="#fbbf24"/><text x="74" y="233" font-size="21" fill="#eef3ff" font-weight="700" text-anchor="start" style="">On-device  /  Edge</text><text x="74" y="261.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Private, instant, works offline. Runs on</text><text x="74" y="283.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">small NPU chips: Apple Neural Engine,</text><text x="74" y="305.06" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Qualcomm, Google Tensor.</text><rect x="56" y="366" width="420" height="150" rx="16" fill="#111733" stroke="#fb923c" stroke-width="2.4" opacity="1"/><rect x="56" y="366" width="6" height="150" rx="3" fill="#fb923c"/><text x="74" y="403" font-size="21" fill="#eef3ff" font-weight="700" text-anchor="start" style="">In the Cloud</text><text x="74" y="431.5" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Most powerful models, but needs internet.</text><text x="74" y="453.28" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">Runs on NVIDIA GPUs and Google TPUs in</text><text x="74" y="475.06" font-size="16.5" fill="#aab8df" font-weight="400" text-anchor="start" style="">data centers.</text><rect x="56" y="536" width="420" height="115.24000000000001" rx="16" fill="#111733" stroke="#eef3ff" stroke-width="2.4" opacity="1"/><rect x="56" y="536" width="6" height="115.24000000000001" rx="3" fill="#eef3ff"/><text x="74" y="571" font-size="19" fill="#eef3ff" font-weight="700" text-anchor="start" style="">Hybrid (most products)</text><text x="74" y="599.0" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">Simple things on the device; hard things</text><text x="74" y="620.12" font-size="16" fill="#aab8df" font-weight="400" text-anchor="start" style="">sent to the cloud.</text><text x="1120" y="165" font-size="22" fill="#c4b5fd" font-weight="800" text-anchor="start" style="">Everyday AI-enabled things</text><rect x="1096" y="196" width="220" height="116" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="1096" y="196" width="6" height="116" rx="3" fill="#c4b5fd"/><text x="1114" y="229" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">📱 Smartphone</text><text x="1114" y="255.0" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">photos, voice,</text><text x="1114" y="273.48" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">translate</text><rect x="1328" y="196" width="220" height="116" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="1328" y="196" width="6" height="116" rx="3" fill="#c4b5fd"/><text x="1346" y="229" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🚗 Car</text><text x="1346" y="255.0" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">lane-keep, self-park</text><text x="1346" y="273.48" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">(Tesla, Waymo)</text><rect x="1096" y="328" width="220" height="116" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="1096" y="328" width="6" height="116" rx="3" fill="#c4b5fd"/><text x="1114" y="361" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🔊 Speaker</text><text x="1114" y="387.0" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">Alexa, Siri, Google</text><rect x="1328" y="328" width="220" height="116" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="1328" y="328" width="6" height="116" rx="3" fill="#c4b5fd"/><text x="1346" y="361" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🚪 Doorbell cam</text><text x="1346" y="387.0" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">face &amp; package</text><text x="1346" y="405.48" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">detection</text><rect x="1096" y="460" width="220" height="116" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="1096" y="460" width="6" height="116" rx="3" fill="#c4b5fd"/><text x="1114" y="493" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🌡️ Thermostat</text><text x="1114" y="519.0" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">Nest learns your habits</text><rect x="1328" y="460" width="220" height="116" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="1328" y="460" width="6" height="116" rx="3" fill="#c4b5fd"/><text x="1346" y="493" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">⌚ Watch</text><text x="1346" y="519.0" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">heart-rhythm alerts</text><rect x="1096" y="592" width="220" height="116" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="1096" y="592" width="6" height="116" rx="3" fill="#c4b5fd"/><text x="1114" y="625" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🦻 Hearing aids</text><text x="1114" y="651.0" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">filter noise in real</text><text x="1114" y="669.48" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">time</text><rect x="1328" y="592" width="220" height="116" rx="16" fill="#111733" stroke="#c4b5fd" stroke-width="2.4" opacity="1"/><rect x="1328" y="592" width="6" height="116" rx="3" fill="#c4b5fd"/><text x="1346" y="625" font-size="17" fill="#eef3ff" font-weight="700" text-anchor="start" style="">🤖 Robot vacuum</text><text x="1346" y="651.0" font-size="14" fill="#aab8df" font-weight="400" text-anchor="start" style="">maps &amp; avoids objects</text><text x="56" y="750" font-size="17" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">“AI-enabled” is not magic: it = a trained model + sensors + the power to act. The center loop shows how the parts connect.</text><text x="56" y="786" font-size="16" fill="#7486b3" font-weight="400" text-anchor="start" style="font-style:italic;">The same model can live in your pocket or in a data center — the difference is privacy, speed, cost and capability.</text><text x="56" y="814" font-size="15" fill="#7486b3">SenSym, LLC  ·  Isac Artzi, PhD</text><text x="1544" y="814" font-size="15" fill="#7486b3" text-anchor="end">How to AI?</text></svg>